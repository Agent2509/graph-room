name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5
      - run: pip install -e backend
      - run: pip install pytest pytest-asyncio httpx ruff
      - run: ruff check backend/graph_rag backend/tests backend/evals
      - run: ruff format --check backend/graph_rag backend/tests backend/evals
      - run: pytest backend -q
      # Replays recorded LLM responses: full pipeline, zero API calls.
      - run: python backend/evals/run.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
