[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-rag"
version = "0.1.0"
description = "A 100% free multiplatform Graph RAG (Retrieval-Augmented Generation) system from scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.11.0",
    "fastembed>=0.4.0",
    "networkx>=3.2",
    "pydantic>=2.7.0",
    "pypdf>=4.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.35.0",
    "pyvis>=0.3.2",
    "flashrank>=0.2.9",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["graph_rag"]
