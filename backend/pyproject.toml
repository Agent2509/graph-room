[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-rag"
version = "2.0.0"
description = "Graph RAG 2.0: one SQLite file, agentic routing, streamed answers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "groq>=0.11",
    "fastembed>=0.4",
    "sqlite-vec>=0.1.9",
    "networkx>=3.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["graph_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
